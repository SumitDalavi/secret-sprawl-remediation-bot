version: '3.8'
services:
  webhook:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    # This expects a command like: docker-compose run bot data/sample_gitleaks_report.json
