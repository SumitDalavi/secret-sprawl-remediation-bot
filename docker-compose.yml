version: '3.8'
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "5000:5000"

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    depends_on:
      - api
    # This expects a command like: docker-compose run bot data/sample_gitleaks_report.json
